[package]
name = "openloops-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
openloops-application = { path = "../openloops-application" }
openloops-contracts = { path = "../openloops-contracts" }
openloops-domain = { path = "../openloops-domain" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"], optional = true }
serde_json = { version = "=1.0.150", optional = true }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"], optional = true }

[features]
default = []
ollama-cloud = ["dep:reqwest", "dep:serde_json", "dep:zeroize"]

[lints]
workspace = true
