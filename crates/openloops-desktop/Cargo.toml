[package]
name = "openloops-desktop"
default-run = "openloops-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
openloops-application = { path = "../openloops-application" }
openloops-contracts = { path = "../openloops-contracts" }
openloops-domain = { path = "../openloops-domain" }
openloops-graph = { path = "../openloops-graph" }
openloops-inference = { path = "../openloops-inference" }
openloops-persistence = { path = "../openloops-persistence" }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
keyring-core = { version = "=1.0.0", default-features = false, optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"], optional = true }
hmac = { version = "=0.13.0", optional = true }
sha2 = { version = "=0.11.0", optional = true }
getrandom = { version = "=0.4.3", optional = true }
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility"], optional = true }
opener = { version = "=0.8.5", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false, optional = true }

[build-dependencies]
slint-build = { version = "=1.17.1", optional = true }

[lints.rust]
# Slint's generated Rust expands its internal vtable macro under an
# `allow(unsafe_code)` scope. The hand-written binary and build script retain
# `#![forbid(unsafe_code)]`; this package-level exception is only what lets the
# generated module compile.
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"

[features]
default = []
live-connection = ["openloops-graph/live-connection"]
ollama-cloud = ["openloops-inference/ollama-cloud"]
openrouter = ["openloops-inference/openrouter"]
native-ui = ["live-connection", "ollama-cloud", "openrouter", "dep:slint", "dep:slint-build", "dep:opener", "dep:zeroize", "dep:keyring-core", "dep:windows-native-keyring-store", "dep:chrono", "dep:hmac", "dep:sha2", "dep:getrandom"]
ui-screenshot = ["native-ui", "dep:image"]

[[bin]]
name = "openloops-ui"
path = "src/bin/openloops-ui.rs"
required-features = ["native-ui"]
